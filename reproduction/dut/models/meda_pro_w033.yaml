# MEDA-Pro controlled DUT experiment: author's final width.
# Architecture and width copied from ../../../../yolo11n-MEDA-Pro.yaml.
nc: 1
scales:
  n: [0.50, 0.33, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [128, False, 0.25]]
  - [-1, 1, ADown, [256]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, ADown, [512]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, ADown, [1024]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, DySample, [2, 'lp']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256]]

  - [-1, 1, DySample, [2, 'lp']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [256, 256, 128]]

  - [-1, 1, DySample, [2, 'lp']]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, MSEF, [128, False, 1, 0.5]]
  - [-1, 1, EMA, [16]]

  - [-1, 1, ADown, [256]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [256, 256, 128]]

  - [-1, 1, ADown, [512]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256]]

  - [-1, 1, ADown, [1024]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, MSEF, [1024, False, 1, 0.5]]

  - [[18, 22, 25, 28], 1, Detect, [nc]]
