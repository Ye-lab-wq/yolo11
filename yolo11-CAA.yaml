# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11n with CAA inserted before each detect head

# Parameters
nc: 1  # 修改为你的类别数（无人机一般为 1）
scales:
  n: [0.50, 0.25, 1024]

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10

# Head with CAA inserted before each Detect layer
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]        # cat backbone P4
  - [-1, 2, C3k2, [512, False]]      # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]        # cat backbone P3
  - [-1, 2, C3k2, [256, False]]      # 16 (P3/8-small)

  # ⭐ 在 P3 检测头前插入 CAA (通道数为64)
  - [-1, 1, CAA, [64, 11, 11]]                  # 17

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]       # cat head P4
  - [-1, 2, C3k2, [512, False]]      # 20 (P4/16-medium)

  # ⭐ 在 P4 检测头前插入 CAA (通道数为128)
  - [-1, 1, CAA, [128, 11, 11]]                  # 21

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]       # cat head P5
  - [-1, 2, C3k2, [1024, True]]      # 24 (P5/32-large)

  # ⭐ 在 P5 检测头前插入 CAA (通道数为256)
  - [-1, 1, CAA, [256, 11, 11]]                  # 25

  - [[17, 21, 25], 1, Detect, [nc]]  # Detect(P3, P4, P5)
